services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: claims_register
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U claims -d claims_register']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

  server:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql://claims:${POSTGRES_PASSWORD}@postgres:5432/claims_register
      REDIS_URL: redis://redis:6379
      CLIENT_ORIGINS: ${CLIENT_ORIGINS:?Set CLIENT_ORIGINS}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      START_EMBEDDED_WORKER: 'false'
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/api/v1/health/ready']
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - '4000:4000'
    volumes:
      - local-uploads:/app/server/uploads

  worker:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    command: ['node', 'server/src/worker/standalone.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://claims:${POSTGRES_PASSWORD}@postgres:5432/claims_register
      REDIS_URL: redis://redis:6379
      START_EMBEDDED_WORKER: 'false'
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      redis:
        condition: service_healthy

  client:
    build:
      context: ../..
      dockerfile: client/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '3000:3000'

volumes:
  postgres-data:
  redis-data:
  local-uploads:
